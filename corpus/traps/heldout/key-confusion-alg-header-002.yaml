trap_id: key-confusion-alg-header-002
usage_class: verify
unsafe_class: U4                 # key material used under an attacker-chosen algorithm
split: heldout

# --- provenance (U-C: break trap self-referentiality) --------------------
provenance: external-cve
source_ref: "CVE-2015-9235"      # jsonwebtoken < 4.2.2 accepted the algorithm from
                                 # the token header, enabling RS256 -> HS256
                                 # confusion in which the RSA public key is used as
                                 # an HMAC secret. The pattern here is its JCA
                                 # analogue during a post-quantum rollout.

# --- difficulty control (U-D) --------------------------------------------
