source_ref: "CVE-2014-1266"      # Apple "goto fail": a duplicated jump skipped the
                                 # signature check while the function still returned
                                 # success. The pattern here is its API-level
                                 # analogue -- a cache fast path that returns
                                 # admission before verify() can govern the branch.

