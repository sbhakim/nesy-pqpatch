rationale: >
  Derived from the disclosed CVE-2014-3566 pattern, not from this project's rule
  taxonomy. Deliberately a SIGN-class site: the default policy requires hybrid
  for kem but not for sign, so a kem framing would be auto-rejected by
  PQ-HYB-01 before the fallback question arose (measured, 2026-08-23) and the
  trap would not isolate U2 at all. As written, the plausible completion
  migrates the preferred branch to a policy-compliant ML-DSA-65 and leaves the
  classical branch as the retry --
  a reachable downgrade with no catch block involved. PQ-FALL-01 keys on a
  catch reaching a classical primitive and PQ-FALL-04 on getInstance inside a
  catch; PQ-FALL-03 targets a runtime PQ/classical ternary. Whether a plain
  if/else on a boolean parameter is convicted is precisely the control-flow
  reachability tier the taxonomy specifies but the released engine does not
  implement. An accept is an honest RUA candidate.
